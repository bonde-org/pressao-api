name: Test

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run migrations (SQLite)
        run: |
          source .venv/bin/activate
          export DATABASE_URL="sqlite+aiosqlite:///./test.db"
          export SECRET_KEY="test-secret-key"
          export KEYCLOAK_URL="http://localhost:8080"
          export KEYCLOAK_REALM="pressao"
          export KEYCLOAK_CLIENT_ID="pressao-api"
          export KEYCLOAK_CLIENT_SECRET="test-secret"
          export SENDGRID_API_KEY="test-key"
          export TWILIO_ACCOUNT_SID="test-sid"
          export TWILIO_AUTH_TOKEN="test-token"
          alembic upgrade head
        
      - name: Run tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          SECRET_KEY: "test-secret-key"
          KEYCLOAK_URL: "http://localhost:8080"
          KEYCLOAK_REALM: "pressao"
          KEYCLOAK_CLIENT_ID: "pressao-api"
          KEYCLOAK_CLIENT_SECRET: "test-secret"
          SENDGRID_API_KEY: "test-key"
          TWILIO_ACCOUNT_SID: "test-sid"
          TWILIO_AUTH_TOKEN: "test-token"
        run: |
          source .venv/bin/activate
          pytest --cov=pressao_api --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false