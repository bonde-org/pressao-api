name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch name'
        required: true
        type: string
      sha:
        description: 'Commit SHA'
        required: true
        type: string
    secrets:
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_TOKEN:
        required: true
      DOCKER_HUB_REPO:
        required: false
      GIT_TOKEN:
        description: 'Token para fazer commit no repositório'
        required: true

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Generate Docker tags
        id: tags
        run: |
          if [ -n "${{ secrets.DOCKER_HUB_REPO }}" ]; then
            REPO="${{ secrets.DOCKER_HUB_REPO }}"
          else
            REPO="igrsantos/pressao-api"
          fi
          echo "repo=${REPO}" >> $GITHUB_OUTPUT
          
          BRANCH_NAME=$(echo "${{ inputs.branch }}" | sed 's/\//-/g')
          echo "branch_tag=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          
          SHA_SHORT=$(echo "${{ inputs.sha }}" | cut -c1-8)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Debug tags
        run: |
          echo "repo: ${{ steps.tags.outputs.repo }}"
          echo "branch_tag: ${{ steps.tags.outputs.branch_tag }}"
          echo "sha_short: ${{ steps.tags.outputs.sha_short }}"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            docker.io/${{ steps.tags.outputs.repo }}:${{ steps.tags.outputs.branch_tag }}
            docker.io/${{ steps.tags.outputs.repo }}:${{ steps.tags.outputs.sha_short }}
            docker.io/${{ steps.tags.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Helm values, commit and push (com retry contra race condition)
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SHA_SHORT="${{ steps.tags.outputs.sha_short }}"
          BRANCH="${{ inputs.branch }}"

          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            if [ -f "helm/values.yaml" ]; then
              sed -i "s/tag: .*/tag: ${SHA_SHORT}/g" helm/values.yaml
            fi

            if git diff --quiet; then
              echo "Nenhuma mudança para commitar"
              exit 0
            fi

            git add helm/
            git commit -m "chore: update image tag to ${SHA_SHORT} [skip ci]"

            if git push origin "HEAD:$BRANCH"; then
              echo "Push ok na tentativa $i"
              exit 0
            fi

            echo "Push rejeitado (tentativa $i/5), outra execução deve ter empurrado antes - resincronizando..."
            sleep $((RANDOM % 5 + 1))
          done

          echo "Falhou apos 5 tentativas"
          exit 1