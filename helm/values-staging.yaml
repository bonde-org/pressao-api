# Overlay de staging: CNPG com 2 instâncias, monitoramento e backup diário.
# helm upgrade --install pressao-api ./helm -f helm/values.yaml -f helm/values-staging.yaml
# Ajuste barmanObjectName para o ObjectStore do Barman Cloud no cluster.

replicaCount: 2

config:
  APP_ENV: staging
  DEBUG: "false"
  LOG_LEVEL: INFO
  SENDGRID_SANDBOX_MODE: "true"

database:
  enabled: true
  instances: 2
  storage:
    size: 20Gi
  walStorage:
    enabled: true
    size: 8Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
  monitoring:
    enablePodMonitor: true
  backup:
    enabled: true
    schedule: "0 0 3 * * *"
    method: plugin
    immediate: false
    target: prefer-standby
    plugin:
      name: barman-cloud.cloudnative-pg.io
    clusterPlugin:
      enabled: true
      name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: pressao-pg-backup-staging
  superuser:
    password: "CHANGE-ME-STAGING-SUPERUSER"

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: pressao-api.staging.example.com
      paths:
        - path: /
          pathType: Prefix
